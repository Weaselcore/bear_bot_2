[project]
name = ""
version = "0.0.1"
requires-python = "~=3.14"
dependencies = [
    "discord.py[voice]",
    "ffmpeg-python",
    "aiofiles",
    "perflint",
    "aiofile",
    "python-dotenv",
    "sqlalchemy[asyncio]",
    "types-cachetools",
    "cachetools",
    "asyncache",
    "tzdata",
    "human-readable",
    "python-dateutil",
    "pytz",
]

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
lint.select = ["E", "F"]
lint.ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
lint.fixable = ["A", "B", "C", "D", "E", "F"]
lint.unfixable = []

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

# Assume Python 3.11.
target-version = "py311"

[dependency-groups]
dev = [
    "autopep8",
    "pylama",
    "types-aiofiles",
    "pytest-async-sqlalchemy",
    "pytest-asyncio",
    "ruff",
    "black",
    "mypy",
    "pylint",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
